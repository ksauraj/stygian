name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Build the demo site
        run: bundle exec jekyll build --baseurl /stygian

      - name: Syntax-check the theme JavaScript
        run: node --check assets/js/stygian.js

      - name: Smoke tests
        run: bundle exec rspec
