---
# Home - standalone landing page layout (just-the-docs `home` alias).
# Renders the title as H1 plus the content, no sidebar.
layout: default
---
<div class="page-wrap">
  <header class="page-head" data-page-title>
    {% if page.label %}<div class="label"><span>{{ page.label }}</span></div>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </header>
  <div class="sty-prose" data-page-content>
    {{ content }}
  </div>
</div>
